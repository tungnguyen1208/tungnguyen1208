<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%">
  <defs>
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.7" />
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#CBD5E1" stroke-width="1.2" />
    </pattern>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="425" cy="68" r="34" />
    </clipPath>
  </defs>

  <!-- Nền & Lưới Blueprint -->
  <rect width="850" height="280" rx="10" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="1.5" />
  <rect width="850" height="280" rx="10" fill="url(#grid)" />

  <!-- 4 Góc đánh dấu kỹ thuật -->
  <path d="M 15 25 L 15 15 L 25 15" fill="none" stroke="#64748B" stroke-width="1.5" />
  <path d="M 835 25 L 835 15 L 825 15" fill="none" stroke="#64748B" stroke-width="1.5" />
  <path d="M 15 255 L 15 265 L 25 265" fill="none" stroke="#64748B" stroke-width="1.5" />
  <path d="M 835 255 L 835 265 L 825 265" fill="none" stroke="#64748B" stroke-width="1.5" />

  <!-- Avatar GitHub -->
  <circle cx="425" cy="68" r="36" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
  
