<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%">
  <defs>
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.7" />
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#CBD5E1" stroke-width="1.2" />
    </pattern>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="425" cy="68" r="34" />
    </clipPath>
  </defs>

  <!-- Nền & Lưới Blueprint -->
  <rect width="850" height="280" rx="10" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="1.5" />
  <rect width="850" height="280" rx="10" fill="url(#grid)" />

  <!-- 4 Góc đánh dấu kỹ thuật -->
  <path d="M 15 25 L 15 15 L 25 15" fill="none" stroke="#64748B" stroke-width="1.5" />
  <path d="M 835 25 L 835 15 L 825 15" fill="none" stroke="#64748B" stroke-width="1.5" />
  <path d="M 15 255 L 15 265 L 25 265" fill="none" stroke="#64748B" stroke-width="1.5" />
  <path d="M 835 255 L 835 265 L 825 265" fill="none" stroke="#64748B" stroke-width="1.5" />

  <!-- Avatar GitHub -->
  <circle cx="425" cy="68" r="36" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
  

  <!-- Tên chính -->
  <text x="425" y="132" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="middle">Nguyễn Đỗ Thanh Tùng</text>

  <!-- Badge Địa điểm -->
  <rect x="335" y="145" width="180" height="22" rx="11" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1" />
  <circle cx="350" cy="156" r="3" fill="#0284C7" />
  <text x="432" y="160" font-family="&#39;Courier New&#39;, monospace" font-size="10" font-weight="700" fill="#0369A1" text-anchor="middle" letter-spacing="0.8">HANOI, VIETNAM</text>

  <!-- Chức danh & Chuyên môn -->
  <text x="425" y="192" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#1E293B" text-anchor="middle">Software Engineer • AI & Backend Developer</text>
  <text x="425" y="212" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">Backend Engineering · AI / RAG Systems · Full-Stack · Network & Security</text>

  <!-- Thanh Timeline kỹ thuật phía dưới -->
  <line x1="205" y1="240" x2="645" y2="240" stroke="#94A3B8" stroke-width="1.5" />
  
  <circle cx="245" cy="240" r="4" fill="#0284C7" />
  <text x="245" y="258" font-family="&#39;Courier New&#39;, monospace" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">BUILD</text>

  <circle cx="365" cy="240" r="4" fill="#0284C7" />
  <text x="365" y="258" font-family="&#39;Courier New&#39;, monospace" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">AUTOMATE</text>

  <circle cx="485" cy="240" r="4" fill="#0284C7" />
  <text x="485" y="258" font-family="&#39;Courier New&#39;, monospace" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">DEPLOY</text>

  <circle cx="605" cy="240" r="4" fill="#0284C7" />
  <text x="605" y="258" font-family="&#39;Courier New&#39;, monospace" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">SCALE</text>
</svg>
